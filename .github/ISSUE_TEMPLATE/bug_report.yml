name: Bug report
description: Report a reproducible Floating Browser problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Floating Browser. Never include passwords, cookies, payment details, private URLs, or personal browsing information.
  - type: input
    id: version
    attributes:
      label: Floating Browser version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: "macOS 15.5, Apple silicon"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      description: Use only the public hostname. Remove private paths and query parameters.
      placeholder: "example.com"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: blocker
    attributes:
      label: Was Block Ads enabled?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, cookies, private URLs, payment details, and personal browsing information.
          required: true
